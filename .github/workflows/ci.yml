name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "from backend.main import app; from fastapi.testclient import TestClient; c=TestClient(app); assert c.get('/api/health').json()['ok']; print('health ok')"
      - run: python scripts/tabpfn_demo.py --check
